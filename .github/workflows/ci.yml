name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  firmware:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [heltec_v4, heltec_v3, rak4631, rak3401_1w, rak19026, lilygo_t_echo, lilygo_t_deck, elecrow_crowpanel_35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

  firmware-tests:
    name: Firmware native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO + OpenSSL headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev
          pip install --upgrade platformio
      - name: Run native tests
        working-directory: firmware
        run: pio test -e native

  mesh-simulator:
    name: Deterministic mesh simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run simulator regression tests
        run: python -m unittest -v tools.test_mesh_simulator tools.test_write_firmware_manifest tools.test_hardware_qualification tools.test_database_migrations tools.test_control_auth_vectors
      - name: Produce benchmark report
        run: python tools/mesh_simulator.py --messages 1000
      - name: Verify release target parity
        run: python tools/validate_release_targets.py
      - name: Verify pinned Actions SHAs are 40 hex
        run: python tools/check_action_pins.py
      - name: Verify hardware/ ignore leaves zero untracked files
        run: python tools/check_hardware_gitignore.py
      - name: Verify web flasher JavaScript
        run: node tools/check_web_flasher.js

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug + release + unit tests
        working-directory: app
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

  lint:
    name: Static analysis (Python + Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify action pins resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_action_pins.py
      - name: Ruff (Python tooling)
        run: pip install ruff && ruff check tools/
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android Lint
        working-directory: app
        run: ./gradlew :app:lintDebug
