name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: false
        type: string
        default: ''

jobs:
  firmware:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [heltec_v4, heltec_v3, rak4631, rak3401_1w, rak19026, lilygo_t_echo, lilygo_t_deck, elecrow_crowpanel_35, seeed_t1000_e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

  firmware-tests:
    name: Firmware native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO + OpenSSL headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev
          pip install --upgrade platformio
      - name: Run native tests
        working-directory: firmware
        run: pio test -e native
      - name: Test production router with simulated radio failures
        run: |
          cmake -S firmware/host-tests -B firmware/host-tests/build -DNANOPB_DIR="$PWD/firmware/.pio/libdeps/native/Nanopb"
          cmake --build firmware/host-tests/build
          ctest --test-dir firmware/host-tests/build --output-on-failure

  mesh-simulator:
    name: Deterministic mesh simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run simulator regression tests
        run: python -m unittest -v tools.test_mesh_simulator tools.test_write_firmware_manifest tools.test_hardware_qualification tools.test_database_migrations tools.test_control_auth_vectors tools.test_package_firmware tools.test_mirror_release_channels
      - name: Produce benchmark report
        run: python tools/mesh_simulator.py --messages 1000
      - name: Verify release target parity
        run: python tools/validate_release_targets.py
      - name: Verify pinned Actions SHAs are 40 hex
        # Authenticated calls: shared runners hit GitHub's anonymous API limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_action_pins.py
      - name: Verify hardware/ ignore leaves zero untracked files
        run: python tools/check_hardware_gitignore.py
      - name: Verify web flasher JavaScript
        run: node tools/check_web_flasher.js
      - name: Verify the flash plan never writes over a node's settings
        run: node tools/test_flashplan.mjs

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug + release + unit tests
        working-directory: app
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

  lint:
    name: Static analysis (Python + Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify action pins resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_action_pins.py
      - name: Ruff (Python tooling)
        run: pip install ruff && ruff check tools/
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android Lint
        working-directory: app
        run: ./gradlew :app:lintDebug

  browser-tests:
    name: Flasher browser interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: npm ci
        working-directory: tools/browser-tests
      - run: npx playwright install --with-deps chromium
        working-directory: tools/browser-tests
      - run: npm test
        working-directory: tools/browser-tests

  ios-kit:
    name: iOS core (AetherMeshKit) tests on Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Swift tests (wire format, crypto vectors, session)
        working-directory: ios/AetherMeshKit
        run: swift test

  ios-app:
    name: iOS app simulator build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          xcodebuild -project AetherMesh.xcodeproj -scheme AetherMesh \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
