name: Deploy web flasher

on:
  push:
    branches: [ main ]
    paths:
      - 'web-flasher/**'
      - 'firmware/**'
      - 'proto/**'
      - 'app/**'
      - 'tools/**'
      - 'config/**'
      - 'VERSION'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages.yml'
  # A release published by hand (the stable flow ends in a draft someone
  # publishes) redeploys so the flasher mirrors it. Releases created by a
  # workflow's own token do not fire this, which is why beta-release.yml
  # dispatches this workflow explicitly instead.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build firmware + bundle flasher
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AETHERMESH_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          AETHERMESH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERMESH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: |
          APP_VERSION=$(grep '^app_version=' ../VERSION | cut -d= -f2)
          APP_CODE=$(grep '^app_version_code=' ../VERSION | cut -d= -f2)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aethermesh-release.jks"
            export AETHERMESH_ANDROID_KEYSTORE="$RUNNER_TEMP/aethermesh-release.jks"
            ./gradlew :app:assembleRelease -PversionCode=${APP_CODE} -PversionName=${APP_VERSION}
            echo "release" > "$RUNNER_TEMP/android-build-type"
          else
            echo "::warning::Android signing secrets are absent; publishing a debug-signed APK."
            ./gradlew :app:assembleDebug -PversionCode=${APP_CODE} -PversionName=${APP_VERSION}
            echo "debug" > "$RUNNER_TEMP/android-build-type"
          fi

      - name: Mirror the Release and Beta channels onto the site
        # The flasher can only download same-origin files: GitHub Release
        # assets redirect to a host with no CORS headers. This copies each
        # channel's newest published build, with its own manifest, next to it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/mirror_release_channels.py --repo "${{ github.repository }}"

      - name: Copy Android APK to web-flasher
        run: |
          BUILD_TYPE=$(cat "$RUNNER_TEMP/android-build-type")
          APK_PATH=$(find app -name "app-${BUILD_TYPE}.apk" | head -n1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" web-flasher/aethermesh-app.apk
            echo "$BUILD_TYPE" > web-flasher/ANDROID_BUILD_TYPE.txt
            echo "Copied APK from $APK_PATH to web-flasher"
          else
            echo "ERROR: Compiled APK not found!"
            exit 1
          fi
          HASH=$(git rev-parse --short=7 HEAD)
          APP_VERSION=$(grep '^app_version=' VERSION | cut -d= -f2)
          APP_CODE=$(grep '^app_version_code=' VERSION | cut -d= -f2)
          printf '{"version":"%s","versionCode":%s,"commit":"%s"}\n' \
            "$APP_VERSION" "$APP_CODE" "$HASH" > web-flasher/app-version.json
          cd web-flasher
          { sha256sum aethermesh-app.apk; find firmware -type f ! -name .gitignore -exec sha256sum {} +; } > SHA256SUMS.txt

      - name: Attest published builds
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            web-flasher/aethermesh-app.apk
            web-flasher/firmware/**

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-flasher

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
