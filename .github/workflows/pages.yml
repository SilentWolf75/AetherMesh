name: Deploy web flasher

on:
  push:
    branches: [ main ]
    paths:
      - 'web-flasher/**'
      - 'firmware/**'
      - 'proto/**'
      - 'app/**'
      - 'tools/**'
      - 'config/**'
      - 'VERSION'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build firmware + bundle flasher
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PlatformIO + esptool
        run: pip install --upgrade platformio esptool

      - name: Build supported firmware targets
        working-directory: firmware
        run: |
          pio run -e heltec_v4
          pio run -e heltec_v3
          pio run -e rak4631
          pio run -e rak3401_1w
          pio run -e rak19026
          pio run -e lilygo_t_echo
          pio run -e lilygo_t_deck
          pio run -e elecrow_crowpanel_35
          pio run -e seeed_t1000_e

      - name: Build Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AETHERMESH_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          AETHERMESH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERMESH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: |
          APP_VERSION=$(grep '^app_version=' ../VERSION | cut -d= -f2)
          APP_CODE=$(grep '^app_version_code=' ../VERSION | cut -d= -f2)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aethermesh-release.jks"
            export AETHERMESH_ANDROID_KEYSTORE="$RUNNER_TEMP/aethermesh-release.jks"
            ./gradlew :app:assembleRelease -PversionCode=${APP_CODE} -PversionName=${APP_VERSION}
            echo "release" > "$RUNNER_TEMP/android-build-type"
          else
            echo "::warning::Android signing secrets are absent; publishing a debug-signed APK."
            ./gradlew :app:assembleDebug -PversionCode=${APP_CODE} -PversionName=${APP_VERSION}
            echo "debug" > "$RUNNER_TEMP/android-build-type"
          fi

      - name: Merge complete USB images + write manifest
        run: |
          set -e
          HASH=$(git rev-parse --short=7 HEAD)
          # Keep Pages OTA labels aligned with firmware/src/Version.h base.
          FW_VERSION=$(grep '^firmware_version=' VERSION | cut -d= -f2)
          FW_VERSION=${FW_VERSION:-$(sed -n 's/^#define AETHERMESH_FW_BASE "\([^"]*\)".*/\1/p' firmware/src/Version.h | head -n1)}
          BOOT_APP0=$(find ~/.platformio/packages -path '*tools/partitions/boot_app0.bin' | head -n1)
          curl -fsSL https://raw.githubusercontent.com/microsoft/uf2/90e9741f217f5a40c98ba74d663e408041037578/utils/uf2conv.py -o /tmp/uf2conv.py
          curl -fsSL https://raw.githubusercontent.com/microsoft/uf2/90e9741f217f5a40c98ba74d663e408041037578/utils/uf2families.json -o /tmp/uf2families.json
          python tools/package_firmware.py --hash "$HASH" --version "$FW_VERSION" --converter /tmp/uf2conv.py --boot-app0 "$BOOT_APP0"

      - name: Copy Android APK to web-flasher
        run: |
          BUILD_TYPE=$(cat "$RUNNER_TEMP/android-build-type")
          APK_PATH=$(find app -name "app-${BUILD_TYPE}.apk" | head -n1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" web-flasher/aethermesh-app.apk
            echo "$BUILD_TYPE" > web-flasher/ANDROID_BUILD_TYPE.txt
            echo "Copied APK from $APK_PATH to web-flasher"
          else
            echo "ERROR: Compiled APK not found!"
            exit 1
          fi
          HASH=$(git rev-parse --short=7 HEAD)
          APP_VERSION=$(grep '^app_version=' VERSION | cut -d= -f2)
          APP_CODE=$(grep '^app_version_code=' VERSION | cut -d= -f2)
          printf '{"version":"%s","versionCode":%s,"commit":"%s"}\n' \
            "$APP_VERSION" "$APP_CODE" "$HASH" > web-flasher/app-version.json
          cd web-flasher
          sha256sum aethermesh-app.apk firmware/* > SHA256SUMS.txt

      - name: Attest published builds
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            web-flasher/aethermesh-app.apk
            web-flasher/firmware/*

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-flasher

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
