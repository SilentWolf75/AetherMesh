[platformio]
default_envs = heltec_v4

[env]
; Stamp the git hash into every build (all environments inherit this).
extra_scripts = pre:version_stamp.py

; Host-side unit tests for pure logic (no Arduino/radio deps). Run: pio test -e native
; Requires a host C++ toolchain + libssl-dev (OpenSSL). CI installs both; see
; .github/workflows/ci.yml "Install PlatformIO + OpenSSL headers".
; PacketAuth is built from src/ with OpenSSL only as the HMAC primitive; the
; PBKDF2 loop and buildConfigCanonical under test are the shipped firmware code.
[env:native]
platform = native
extra_scripts =
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<PacketAuth.cpp>
    +<AuthProof.cpp>
build_flags =
    -DAETHERMESH_NATIVE_CRYPTO
    -Wno-deprecated-declarations
    -lssl
    -lcrypto
lib_deps =
    nanopb/Nanopb@^0.4.8

[env:heltec_v4]
platform = espressif32 @ 6.6.0
board = heltec_v4
framework = arduino
monitor_speed = 115200
build_flags =
    -D HELTEC_V4
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    jgromes/RadioLib@^6.5.0
    nanopb/Nanopb@^0.4.8
    olikraus/U8g2@^2.35.15
    mikalhart/TinyGPSPlus@^1.0.3
    operatorfoundation/Crypto@^0.4.0

[env:heltec_v3]
platform = espressif32 @ 6.6.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -D HELTEC_V3
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    jgromes/RadioLib@^6.5.0
    nanopb/Nanopb@^0.4.8
    olikraus/U8g2@^2.35.15
    mikalhart/TinyGPSPlus@^1.0.3
