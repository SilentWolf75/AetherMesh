; SenseCAP Card Tracker T1000-E (nRF52840 + LR1110 + AG3335). Factory
; SoftDevice is S140 7.3.0 — use Meshtastic's Adafruit nRF52 fork for SD7 APIs.
[env:seeed_t1000_e]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#2c07b9979fe8dd51363807ba217e89f32921b66d
platform_packages =
    framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino.git#0fd295f13203e93df19d578073646ec32f2bf45a
board = tracker-t1000-e
board_build.variants_dir = variants
board_build.variant = Seeed_T1000-E
board_build.ldscript = ldscripts/nrf52840_s140_v7.ld
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
build_flags =
    -D SEEED_T1000_E
    -D LOOP_STACK_SZ=2048
    -D CFG_BLE_TASK_STACKSIZE=2048
lib_deps =
    jgromes/RadioLib@^6.5.0
    nanopb/Nanopb@^0.4.8
    mikalhart/TinyGPSPlus@^1.0.3
    operatorfoundation/Crypto@^0.4.0
