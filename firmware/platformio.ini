[env:lilygo_t_echo]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#2c07b9979fe8dd51363807ba217e89f32921b66d
board = nrf52840_dk_adafruit
framework = arduino
upload_protocol = nrfutil
monitor_speed = 115200
build_flags =
    -D LILYGO_T_ECHO
    ; Bluefruit runs the whole phone-API chain in its BLE task; the stock
    ; 5 KB stack is too small once pairing, config and crypto stack up.
    -D CFG_BLE_TASK_STACKSIZE=2048
lib_deps =
    jgromes/RadioLib@^6.5.0
    nanopb/Nanopb@^0.4.8
    mikalhart/TinyGPSPlus@^1.0.3
    operatorfoundation/Crypto@^0.4.0
    ; 1.54" SSD1681 e-paper (GDEH0154D67). Driven in software-SPI mode so it
    ; doesn't contend with the SX1262 on the default hardware SPI bus.
    adafruit/Adafruit EPD@^4.5.5
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.15.0
    ; BME280 weather sensor (temp/humidity/pressure) on I2C
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:lilygo_t_deck]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D LILYGO_T_DECK
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    jgromes/RadioLib@^6.5.0
    nanopb/Nanopb@^0.4.8
    olikraus/U8g2@^2.35.15
    mikalhart/TinyGPSPlus@^1.0.3
    operatorfoundation/Crypto@^0.4.0

