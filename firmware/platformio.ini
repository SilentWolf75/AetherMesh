[env:rak4631]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#2c07b9979fe8dd51363807ba217e89f32921b66d
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200
build_flags =
    -D RAK4631
    ; Bluefruit runs the whole phone-API chain in its BLE task; the stock
    ; 5 KB stack is too small once pairing, config and crypto stack up.
    -D CFG_BLE_TASK_STACKSIZE=2048
lib_deps =
    jgromes/RadioLib@^6.5.0
    nanopb/Nanopb@^0.4.8
    olikraus/U8g2@^2.35.15
    mikalhart/TinyGPSPlus@^1.0.3
    operatorfoundation/Crypto@^0.4.0

